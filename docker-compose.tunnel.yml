services:
  remote-print-server:
    environment:
      TUNNEL_MODE: legacy
      TUNNEL_STATE_DIR: /app/tunnel-state
    volumes:
      - remote-print-tunnel-state:/app/tunnel-state
  remote-print-tunnel:
    image: ${TUNNEL_IMAGE:-remote-print-tunnel:local}
    build:
      context: ./server
      dockerfile: Dockerfile.tunnel
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    sysctls:
      net.ipv4.ip_forward: "1"
    ports:
      - "${TUNNEL_UDP_PORT:-51820}:51820/udp"
    environment:
      TUNNEL_SERVER_PUBLIC_KEY: ${TUNNEL_SERVER_PUBLIC_KEY:?Set the same public key configured for the server}
    volumes:
      - remote-print-tunnel-state:/app/tunnel-state:ro
      - ./server/certs/tunnel-private.key:/run/secrets/tunnel_private_key:ro

volumes:
  remote-print-tunnel-state:
